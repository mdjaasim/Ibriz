<style>
body{margin:0;background:#0B0A08}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.serif{font-family:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;font-optical-sizing:auto}
.mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.rise{opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) .3s forwards}

.fade{opacity:0;animation:fade .9s ease forwards}
@keyframes fade{to{opacity:1}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.16,1,.3,1) 1.5s both}
@keyframes grow{from{transform:scaleY(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(.16,1,.3,1) 2s infinite;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(4);opacity:0}}
.tab{height:44px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.stat{display:flex;flex-direction:column;gap:4px;padding:12px 0}
@media (prefers-reduced-motion: reduce){.rise,.draw,.fade,.grow,.pulse{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}}
