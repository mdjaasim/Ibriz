<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ibriz · New alert</title>
</head>
<body style="margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#050403">
<div class="x-dc">

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&amp;family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;family=Anek+Tamil:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A08}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit;background:none;border:0;padding:0;outline:none;width:100%}
.serif{font-family:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;font-optical-sizing:auto}
.mono{font-family:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.ta{font-family:'Anek Tamil','Noto Sans Tamil',system-ui,sans-serif}
.wm .i{position:relative;display:inline-block}
.wm .i b{position:absolute;left:50%;top:.17em;width:.14em;height:.14em;background:#D4B06A;transform:translateX(-50%) rotate(45deg)}
.rise{opacity:0;animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade 1s ease forwards}
@keyframes fade{to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform-origin:left;animation:bar 1.2s cubic-bezier(.16,1,.3,1) both}
@keyframes bar{from{transform:scaleX(0)}}
.sheet{animation:sheet .8s cubic-bezier(.22,1.12,.36,1) both}
@keyframes sheet{from{transform:translateY(64px);opacity:0}to{transform:none;opacity:1}}
.scrim{animation:fade .5s ease both;opacity:1}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(.16,1,.3,1) 1.6s infinite;opacity:0}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(4);opacity:0}}
.shimmer{background:linear-gradient(90deg,rgba(241,234,219,0.06) 0%,rgba(241,234,219,0.16) 50%,rgba(241,234,219,0.06) 100%);background-size:200% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.tab{height:44px;min-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lbl{margin:0;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#857E70;font-weight:500}
.chip{height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(241,234,219,0.09);font-size:14px;color:#A8A090;display:inline-flex;align-items:center;gap:8px}
.chip.on{border-color:rgba(212,176,106,0.6);color:#F1EADB;background:rgba(212,176,106,0.08)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;background:#D4B06A;color:#14110A;font-size:15px;font-weight:500;letter-spacing:0.01em}
.btn2{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;border:1px solid rgba(241,234,219,0.16);color:#F1EADB;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;min-height:54px;border-bottom:1px solid rgba(241,234,219,0.09);gap:16px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:rgba(241,234,219,0.14);flex:none}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#A8A090;transition:transform .3s}
.sw.on{background:rgba(212,176,106,0.85)}
.sw.on i{transform:translateX(18px);background:#14110A}
@media (prefers-reduced-motion: reduce){.rise,.fade,.draw,.bar,.sheet,.scrim,.pulse,.shimmer{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}}
</style>

<main style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0A08; color: #F1EADB; font-family: 'Geist', system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; padding: 54px 24px 0 24px; opacity: 0.5"><div class="serif" style="font-size: 30px; height: 44px; display: flex; align-items: center">Alerts</div></div><div class="scrim" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(5,4,3,0.72)"></div><section class="sheet" role="dialog" aria-label="New alert" style="position: absolute; left: 0; right: 0; bottom: 0; top: 170px; background: #13110E; border-radius: 28px 28px 0 0; box-shadow: 0 -1px 0 rgba(241,234,219,0.10), 0 -30px 60px rgba(0,0,0,0.5); padding: 0 24px"><div aria-hidden="true" style="width: 36px; height: 4px; border-radius: 2px; background: rgba(241,234,219,0.18); margin: 10px auto 0 auto"></div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 18px">
<h1 class="serif" style="margin: 0; font-size: 28px; font-weight: 400">New alert</h1>
<a href="Alerts.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="#A8A090" stroke-width="1.4" stroke-linecap="round"></path></svg></a>
</div>
<div style="display: flex; gap: 8px; margin-top: 18px" role="radiogroup" aria-label="Alert type"><button type="button" role="radio" aria-checked="true" class="chip on">Price</button><button type="button" role="radio" aria-checked="false" class="chip">Daily move</button><button type="button" role="radio" aria-checked="false" class="chip">Break-even</button></div>
<p style="margin: 26px 0 0 0; font-size: 16px; color: #A8A090">When <span style="color: #F1EADB">22K</span> goes <button type="button" style="display: inline-flex; align-items: center; gap: 6px; color: #D4B06A; border-bottom: 1px solid rgba(212,176,106,0.5)">below<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="#D4B06A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></p>
<div style="display: flex; align-items: baseline; gap: 8px; height: 70px; border-bottom: 1px solid #D4B06A; margin-top: 6px">
<label for="target" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Target rate per gram</label>
<span style="font-size: 22px; font-weight: 300; color: #D4B06A">₹</span><input id="target" class="serif" value="11,200" readonly style="width: 2.75em; flex: none; font-size: 54px; line-height: 1; letter-spacing: -0.01em"><span style="font-size: 16px; color: #A8A090">a gram</span></div>
<p style="margin: 10px 0 0 0; font-size: 13px; color: #857E70">Today <span class="mono" style="color: #A8A090">₹11,481</span> · <span class="mono" style="color: #A8A090">2.4%</span> away</p>
<div role="radiogroup" aria-label="How to tell you" style="margin-top: 20px; border-top: 1px solid rgba(241,234,219,0.09)">
<button type="button" role="radio" aria-checked="true" class="row" style="width: 100%; text-align: left; min-height: 60px"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px">Notification</span><span style="font-size: 12px; color: #857E70">Works when Ibriz is closed</span></span><i aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid #D4B06A; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><i style="width: 10px; height: 10px; border-radius: 50%; background: #D4B06A"></i></i></button>
<button type="button" role="radio" aria-checked="false" class="row" style="width: 100%; text-align: left; min-height: 60px"><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px">In the app only</span><span style="font-size: 12px; color: #857E70">Nothing leaves this phone</span></span><i aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(241,234,219,0.28); box-sizing: border-box"></i></button>
</div>
<div style="position: absolute; left: 24px; right: 24px; bottom: 34px"><a href="Alerts.html" class="btn">Save alert</a></div>
</section>
</main>
</div>
</body>
</html>
