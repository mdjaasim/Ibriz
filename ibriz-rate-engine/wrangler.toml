name = "ibriz-rates"
main = "src/index.js"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/5 * * * *"]   # every 5 minutes

# Settings you can change without touching code. Duty and premium are fractions.
[vars]
DUTY = "0.15"       # effective import duty on gold since 13 May 2026
PREMIUM = "0.03"    # starting guess; the one-week validation will tune this
MAX_JUMP = "0.05"   # reject a reading that differs from the last by more than 5%
# FX_FALLBACK = "90" # optional: used only if every USD/INR source fails and nothing is cached

# Fill these two in after running the commands in README.md
[[kv_namespaces]]
binding = "RATES"
id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "ibriz"
database_id = "REPLACE_WITH_D1_ID"
